name: Build Desktop Binaries (Linux AppImage & Windows EXE)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux AppImage (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri AppImage
        run: npm run tauri build

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TallyPrimeMOD-Linux-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    name: Build Windows Executable (.exe & .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri Windows Binary
        run: npm run tauri build

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TallyPrimeMOD-Windows-Executable
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
